<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BACKTEST MACHINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div class="scanline"></div>
<div class="container">

  <header class="header">
    <h1 class="glow-text">BACKTEST <span class="accent">MACHINE</span></h1>
    <div class="clock" id="clock"></div>
  </header>

  <div class="status-bar">
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">IDLE</span>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="panel">
    <div class="panel-header">STEP 1: LOGIN</div>
    <div class="controls-row">
      <div class="input-group grow">
        <label>SUPER TOKEN</label>
        <div class="token-input-wrap">
          <input type="password" id="tokenInput" placeholder="Paste SuperToken here" />
          <button class="btn-icon" id="toggleToken">&#128065;</button>
        </div>
      </div>
      <button class="btn btn-start" onclick="login()">LOGIN</button>
    </div>
  </div>

  <!-- CONFIG -->
  <div class="panel">
    <div class="panel-header">STEP 2: CONFIGURE</div>
    <div class="controls-row">
      <div class="input-group">
        <label>CSV PATH</label>
        <input type="text" id="csvInput" value="C:\Users\omkar\Downloads\Backtest bb_blast_sell_Combined.csv" />
      </div>
    </div>
    <div class="controls-row" style="margin-top:12px">
      <div class="input-group">
        <label>SL %</label>
        <input type="number" id="slInput" value="0.6" min="0.1" step="0.1" />
      </div>
      <div class="input-group">
        <label>TP %</label>
        <input type="number" id="tpInput" value="1.3" min="0.1" step="0.1" />
      </div>
      <div class="input-group">
        <label>CAPITAL / STOCK</label>
        <input type="number" id="capInput" value="200000" min="10000" step="10000" />
      </div>
      <div class="input-group">
        <label class="checkbox-label">
          <input type="checkbox" id="skipDownload" /> SKIP DOWNLOAD
        </label>
      </div>
    </div>
  </div>

  <!-- RUN -->
  <div class="panel">
    <div class="panel-header">STEP 3: RUN</div>
    <div class="controls-row">
      <button class="btn btn-start btn-large" id="runBtn" onclick="runBacktest()">RUN BACKTEST</button>
      <button class="btn btn-download" id="downloadBtn" onclick="downloadResults()" disabled>DOWNLOAD EXCEL</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="kpi-row" id="summaryRow" style="display:none">
    <div class="kpi-card pnl-card" id="pnlCard">
      <div class="kpi-label">TOTAL P&L</div>
      <div class="kpi-value" id="pnlValue">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">WIN RATE</div>
      <div class="kpi-value" id="wrValue">0%</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">TRADES</div>
      <div class="kpi-value" id="tradesValue">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">WINS / LOSSES</div>
      <div class="kpi-value" id="wlValue">0 / 0</div>
    </div>
  </div>

  <!-- LOG -->
  <div class="panel log-panel">
    <div class="panel-header">
      <span>LOG</span>
      <button class="btn-icon-sm" onclick="clearLog()">CLEAR</button>
    </div>
    <div class="log-console" id="logConsole"></div>
  </div>

</div>
<script src="/static/js/main.js"></script>
</body>
</html>
